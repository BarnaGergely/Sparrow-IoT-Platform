<h2>Login</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <input type="email" pInputText placeholder="Email" formControlName="email">
    <p-password placeholder="Password" formControlName="password" [feedback]="false">
    </p-password>
    <p-button label="Login" type="submit" />
</form>
