<h1>Devices</h1>

@if (!devices) {
    <p>Loading...</p>
} @else if (devices && devices.length < 0) { 
    <p>No devices found</p>
} @else {
    <ul>
        @for (device of devices; track $index) {
            <li [ngStyle]="{'color': getStatusColor(device)}">
                <a [routerLink]="['/devices', device.id]" [ngStyle]="{'color': getStatusColor(device)}">{{ device.name }}</a>
            </li>
        }
    </ul>
}
